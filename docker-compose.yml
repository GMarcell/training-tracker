services:
  db:
    image: postgres:16
    container_name: training-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: training
      POSTGRES_PASSWORD: training
      POSTGRES_DB: training_tracker
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - training-tracker-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U training -d training_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  training-tracker-db-data:
